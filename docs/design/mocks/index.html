<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toate ecranele · mock-uri (Cartierul Tineretului, Sibiu)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .index { max-width: calc(var(--space-8) * 28); margin: 0 auto; padding: var(--space-8) var(--space-6); display: grid; gap: var(--space-8); }
    .index h1 { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: 700; }
    .index h2 { font-size: var(--text-lg); line-height: var(--lh-lg); font-weight: 600; margin-bottom: var(--space-3); }
    .rows { list-style: none; display: grid; gap: var(--space-2); }
    .row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); align-items: center;
      padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-border); scroll-margin-top: calc(var(--space-8) * 3); }
    .row:target { border-color: var(--color-primary); background: var(--color-primary-subtle); }
    .row-name { font-weight: 600; overflow-wrap: anywhere; }
    .row-name small { display: block; font-weight: 400; font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--color-text-muted); }
    .row-end { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; justify-content: flex-end; }
    .st { font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 600; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-input); color: var(--color-text-muted); }
    .st-approved { border-color: var(--color-success); color: var(--color-success); background: var(--color-success-bg); }
    .st-draft { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-subtle); }
    .undrawn { font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--color-text-muted); }
    @media (max-width: 767px) { .row { grid-template-columns: auto minmax(0, 1fr); } .row-end { grid-column: 1 / -1; justify-content: flex-start; } }
  </style>
</head>
<body data-theme="light">
  <!-- Mock controls: the role, size and theme chosen here travel to every mock opened from this page -->
  <header class="mock-bar" id="mock-bar" aria-label="Comenzi mock"></header>
  <main class="index" id="index"></main>

  <script src="shared.js"></script>
  <script>
    const S = mockState({ role: 'vizitator', size: 'phone', theme: 'light' }, { roles: ['vizitator', 'cetatean', 'neconfirmat', 'operator', 'admin'] });
    const STATUS_LABEL = { planned: 'planned', draft: 'draft', approved: 'approved', implemented: 'implemented', deprecated: 'deprecated' };

    function bar() {
      const seg = (ctl, items) => `<div class="seg" data-ctl="${ctl}">${items.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('')}</div>`;
      document.getElementById('mock-bar').innerHTML = `
        <div class="mock-group"><strong>Toate ecranele</strong></div>
        <div class="mock-group"><span>Rol</span>${seg('role', ['vizitator', 'cetatean', 'neconfirmat', 'operator', 'admin'].map(r => [r, ROLE_LABELS[r]]))}</div>
        <div class="mock-group"><span>Mărime</span>${seg('size', [['phone', 'Telefon'], ['desktop', 'Desktop']])}</div>
        <div class="mock-group"><span>Temă</span>${seg('theme', [['light', 'Light'], ['dark', 'Dark']])}</div>`;
    }

    function render() {
      syncBar(S);
      const p = new URLSearchParams(carried(S));
      history.replaceState(null, '', `${location.pathname}?${p}${location.hash}`);
      const target = screen(location.hash.slice(1));
      const notice = target && !target.file ? `<div class="msg msg-note" role="status">
          <div class="msg-title">${ic('i-image')}${target.id} · ${target.ro}: încă nedesenat</div>
          <p>Ecranul e în lista aprobată (registry.yaml), dar nu are încă mock. Linkul care te-a adus aici va duce la mock când va fi desenat.</p></div>` : '';
      const groups = SCREEN_GROUPS.map(([g, label]) => {
        const rows = SCREENS.filter(s => s.group === g).map(s => `<li class="row" id="${s.id}">
            <span class="mock-id">${s.id}</span>
            <span class="row-name">${s.ro}<small>${s.name}</small></span>
            <span class="row-end"><span class="st st-${s.status}">${STATUS_LABEL[s.status]}</span>
              ${s.file ? `<a class="btn btn-secondary btn-sm" href="${mockHref(s.id)}">Deschide mock-ul ${ic('i-chevron')}</a>` : '<span class="undrawn">încă nedesenat</span>'}</span></li>`).join('');
        return `<section aria-labelledby="g-${g}"><h2 id="g-${g}">${label}</h2><ul class="rows">${rows}</ul></section>`;
      }).join('');
      document.getElementById('index').innerHTML = `<div><h1>Toate ecranele</h1>
          <p class="muted">Ecranele din <code>docs/design/registry.yaml</code>, pe roluri. Rolurile sunt ierarhice (D-012): fiecare rol vede și ecranele rolurilor de deasupra lui în listă.</p></div>
        ${notice}${groups}`;
    }

    document.addEventListener('click', e => {
      const ctl = e.target.closest('[data-ctl] button');
      if (ctl) { S[ctl.parentElement.dataset.ctl] = ctl.dataset.v; render(); }
    });
    window.addEventListener('hashchange', render);
    bar();
    render();
  </script>
</body>
</html>
