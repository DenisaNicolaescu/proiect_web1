# docs/design/registry.yaml — every screen and shared component, by DS- ID.
# Plans, commits, mocks and board files use the ID (tickets don't). kind: foundation | component | screen
# status: planned (approved in the screen list, no mock yet) | draft (mock drawn) | approved (confirmed on the board) | implemented | deprecated (never delete an entry)
# roles: who sees the screen. Roles are hierarchical (D-012): a role also sees the screens of the roles below it.
#   vizitator (unauthenticated) < cetatean < operator < admin

designs:
  # ── Public: vizitator and every signed-in role ──────────────────────────────
  - id: DS-001
    name: Map & List
    kind: screen
    status: approved
    route: /
    roles: [vizitator]
    description: Public map with marker clusters and the Cartierul Tineretului polygon, filters by category, status and report date ("Raportată"), list view, and CSV / GeoJSON export of all public sesizări (the only place with export). On Mobile, map and list are shown one at a time with a toggle.
    brief: Harta cu clustere, filtre pe categorie / status / vârstă, listă; Export CSV / GeoJSON

  - id: DS-002
    name: Sesizare Detail
    kind: screen
    status: approved
    route: /issues/:id
    roles: [vizitator]
    description: >-
      Photo gallery (before / after), map pin, status timeline with SLA indicator (remaining / depășit), vote count, comments.
      One screen with role variants (states in one mock):
      vizitator — read-only, "Intră în cont ca să votezi și să comentezi" instead of actions;
      cetatean — "Mă afectează și pe mine" vote ("Ai votat", "Retrage votul"; no vote button for the author, Q-016), text-only comments (Q-004), follow ("Urmărești");
      unconfirmed account (D-007) — actions blocked, "Verifică-ți emailul ca să poți vota" with resend;
      operator (and admin) — no vote button and no "Urmărește", only the number of people affected; their own report is not a vote; they track sesizări from DS-004 (D-012); adds the operator panel: status change (opens DS-011), a "Posibile duplicate" section (same category, under 50 m, last 30 days) that opens DS-012, and, on a primary sesizare, the merge history with "Anulează unirea" (opens DS-012 in unmerge mode);
      fuzionata — banner linking to the primary sesizare.
      On a primary sesizare, the photo of a merged one appears in the gallery as "Din #N" (D-005); after an unmerge, both timelines keep the merge and add "Unire anulată".
    brief: Detaliu per sesizare; vot "mă afectează și pe mine", comentarii, urmărire; indicator de depășire; fuziune

  - id: DS-005
    name: Public Statistics
    kind: screen
    status: planned
    route: /statistics
    roles: [vizitator]
    description: Statistics computed from the data, never hard-coded — average resolution time in working days per category (from the report to the last resolution, D-015), % resolved, sesizări over SLA, totals. No export here (export lives on DS-001).
    brief: Pagină publică de statistici (timp mediu de rezolvare, procent rezolvate, pe categorie)

  # ── Authentication: vizitator ───────────────────────────────────────────────
  - id: DS-007
    name: Sign In & Register
    kind: screen
    status: planned
    route: /auth/login, /auth/register
    roles: [vizitator]
    description: Sign in and registration. Registration always creates a Cetățean account; Operators and Admins are appointed in DS-013. Email confirmation states (D-007) — "Verifică-ți emailul", resend link, link expired, confirmed. Honeypot field (D-006).
    brief: Indirect — un vot per utilizator; roluri (D-006, D-007)

  - id: DS-008
    name: Password Reset
    kind: screen
    status: planned
    route: /auth/reset-password
    roles: [vizitator]
    description: Two states — request a reset link by email; set a new password from the link (including link expired).
    brief: Not in the brief

  # ── Cetățean ────────────────────────────────────────────────────────────────
  - id: DS-003
    name: Report a Sesizare
    kind: screen
    status: approved
    route: /report
    roles: [cetatean]
    description: >-
      Photo upload with the EXIF GPS suggestion ("Am găsit locația din poză, o folosești?"; the photo is resized and its EXIF stripped before publication, D-011),
      map pin checked against the exact polygon of cartier.geojson (D-009), "Folosește locația mea" (browser GPS), category / subcategory (D-004), title (Q-020),
      description, "Stradă" as a text field with suggestions from the area's 16 streets, deduced from the pin, checked when leaving the field ("Strada nu e în aria…",
      "Nu am găsit strada…"), with the street → map highlight, and an optional "Reper" (D-014),
      "Raportează anonim" (Q-018), live duplicate card (same category, under 50 m, last 30 days, D-005), rate limit (D-006).
      One screen with role variants (states in one mock):
      vizitator — no form, "Intră în cont ca să raportezi" (DS-007);
      cetatean — the full form; the report counts as their vote (Q-016) and they follow it automatically; duplicate card "Există deja, votează-o" → DS-002 of the existing sesizare;
      unconfirmed account (D-007) — form blocked, "Verifică-ți emailul ca să poți raporta" with resend;
      operator (and admin) — the same form; the report is not a vote and is not followed (D-012); the duplicate card reads "Vezi sesizarea existentă (#N)".
      After sending — DS-002 of the new sesizare (the example #25 in mocks/shared.js).
    brief: Raportare (categorie, descriere, poză, locație, opțional anonim); detecție de duplicate la raportare

  - id: DS-009
    name: My Sesizări
    kind: screen
    status: planned
    route: /me/reports
    roles: [cetatean]
    description: >-
      Two tabs — "Raportate de mine" and "Urmărite" — each sesizare with its status and SLA. Operator and admin see only "Raportate de mine": they do not follow (D-012).
    brief: Urmărire (notificare la schimbare de status); "Raportate de mine" is not explicitly in the brief

  - id: DS-010
    name: Profile & Notifications
    kind: screen
    status: planned
    route: /me/profile
    roles: [cetatean]
    description: Minimal — name, password change, one switch for notification emails. The unsubscribe link in DS-014 leads here.
    brief: Notificări prin email; the profile itself is not in the brief

  - id: DS-014
    name: Grouped Notification Email
    kind: screen
    status: planned
    route: email
    roles: [cetatean]
    description: >-
      One email that groups several status changes of followed sesizări (up to 10 changes in 5 minutes), each with sesizare, old → new status and a link to DS-002 (a merge or unmerge of a followed secondary sesizare counts as a change, Q-024); unsubscribe link to DS-010. Sent only to Cetățean accounts: Operators and Admins do not follow (D-012).
    brief: Notificări prin email la schimbări de status, din job, cu grupare

  # ── Operator ────────────────────────────────────────────────────────────────
  - id: DS-004
    name: Triage Queue
    kind: screen
    status: approved
    route: /operator/triage
    roles: [operator]
    description: >-
      Queue of sesizări ordered by SLA: SLA depășit first (most working days over), then the fewest working days left; ties: more people affected, then the lower #id (Q-025).
      Filters by status (default the open ones: nouă, confirmată, în lucru), category and street (the 16 streets, D-014); search by title or #id.
      Each row: thumbnail, #id, title, category, street, status, SLA ("SLA depășit cu N zile lucrătoare" / "SLA: mai sunt N zile lucrătoare"), people affected,
      and "Posibil duplicat" (same category, under 50 m, last 30 days, D-005) linking to DS-012 with the pair. The row opens DS-002; "Schimbă statusul" opens DS-011;
      both dialogs come back here. On Mobile, a list of wide cards; filters behind "Filtre". Vizitator, cetățean and unconfirmed account see "Nu ai acces la această pagină" (D-012).
    brief: Un operator poate tria o săptămână de sesizări doar din aplicație; termene (SLA) cu indicator de depășire

  - id: DS-011
    name: Status Change Dialog
    kind: screen
    status: approved
    route: dialog (from DS-004 and DS-002)
    roles: [operator]
    description: >-
      Moves a sesizare one step (D-015): nouă → confirmată or respinsă; confirmată → în lucru or respinsă; în lucru → rezolvată or respinsă;
      rezolvată or respinsă → confirmată (reopen; the SLA starts again from that date). Only the steps allowed from the current status are offered. Reason required to reject and to reopen;
      photo required to resolve (resized, published without EXIF, D-011). Shows that the followers get the grouped email (DS-014).
      States: choose a step, no reason, no photo, photo uploading, saving, success, reopen, no followers, loading, save error, long text.
      Goes back to the screen it was opened from (?din=DS-004, or DS-002 of the sesizare).
    brief: Workflow de status, cu motiv la respingere și poză la rezolvare; doar operatorii schimbă statusul

  - id: DS-012
    name: Merge & Unmerge Dialog
    kind: screen
    status: approved
    route: dialog (from DS-002 and DS-004)
    roles: [operator]
    description: >-
      Merge — opened from "Posibile duplicate" on DS-002 or "Posibil duplicat" on DS-004, for a pair that meets D-005 (same category, under 50 m, last 30 days; the check is shown);
      the operator picks the primary sesizare and sees the effect before confirming: unique votes as COUNT(DISTINCT user_id) with the sum shown ("4 + 2 voturi, 1 comun → 5 persoane afectate"),
      comments and photos moved with "din #N", followers, history; the secondary becomes fuzionată with the banner on DS-002.
      Unmerge — opened from the merge history of the primary sesizare on DS-002; shows what returns exactly as it was (status, votes, comments, followers, history) and asks to confirm (D-005).
      The followers of the secondary sesizare get the grouped email at a merge and at an unmerge (D-015).
      States: choose, preview, merging, merged, unmerge, unmerging, unmerged, already merged (error), no duplicates, loading, long text. Example pair: #15 → #14.
    brief: Operatorul poate uni două sesizări păstrând voturile și comentariile; fuziunea e reversibilă

  # ── Admin ───────────────────────────────────────────────────────────────────
  - id: DS-006
    name: Categories & SLA
    kind: screen
    status: planned
    route: /admin/categories
    roles: [admin]
    description: Edit the 14 categories and their subcategories, and the SLA in working days of each main category (D-004). Duplicate thresholds are not here — they are fixed in server configuration (D-005).
    brief: Roluri — admin (categorii, SLA-uri)

  - id: DS-013
    name: Users & Roles
    kind: screen
    status: planned
    route: /admin/users
    roles: [admin]
    description: Search users and set each account's single role — cetatean, operator or admin (D-012).
    brief: Roluri — admin (utilizatori)
